# Render.com blueprint: one Docker web service running the Django API.
# It also serves the built UI itself, and the GitHub Pages frontend calls it cross-origin.
services:
  - type: web
    name: sheharyarxd-weather-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      # Allow the GitHub Pages frontend to call the API.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sheharyarxd.github.io"
      # RENDER_EXTERNAL_HOSTNAME is injected by Render and added to ALLOWED_HOSTS automatically.
